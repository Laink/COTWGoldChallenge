      const box = $("mapbox").getBoundingClientRect(), r = el.getBoundingClientRect();
      const x = r.left - box.left + r.width / 2, y = r.top - box.top;
      tip.style.left = Math.min(Math.max(4, x - tip.offsetWidth / 2), box.width - tip.offsetWidth - 4) + "px";
      tip.style.top = (y - tip.offsetHeight - 6 < 4 ? y + r.height + 6 : y - tip.offsetHeight - 6) + "px";
    };
    el.tabIndex = 0;
    el.onmouseenter = el.onfocus = () => { show(); if (on) on(); };
    el.onmouseleave = el.onblur = () => { tip.hidden = true; if (off) off(); };
  };
  // estimated zones: the harvests of the hunting log, known by their region only
  const svg = $("mZones"), badges = $("mBadges");
  svg.innerHTML = "";
  svg.classList.remove("dim");
  badges.innerHTML = "";
  if ($("mZonesOn").checked) {
    const groups = new Map();
    for (const h of inZone) groups.set(h.g, (groups.get(h.g) || []).concat(h));
    const drawn = [...groups.keys()].map(g => zoneOf[g]);
    const NS = "http://www.w3.org/2000/svg", defs = document.createElementNS(NS, "defs");
    svg.append(defs);
    const polygon = (z, cls) => {
      const p = document.createElementNS(NS, "polygon");
      p.setAttribute("points", z.p.map(([x, y]) => ax(x) + "," + ay(y)).join(" "));
      if (cls) p.setAttribute("class", cls);
      return p;
    };
    let n = 0;
    for (const [g, hs] of groups) {
      const z = zoneOf[g], subs = subZones(z, loaded.z), id = "mz" + n++;
      // the zone without its more precise zones: a mask cuts them out, their outlines stay inside
      const poly = document.createElementNS(NS, "g");
      poly.setAttribute("class", "zone");
      const outer = polygon(z);
      if (subs.length) {
        const mask = document.createElementNS(NS, "mask"), clip = document.createElementNS(NS, "clipPath");
        mask.id = id + "m";
        clip.id = id + "c";
        mask.setAttribute("maskUnits", "userSpaceOnUse");
        for (const a of ["x", "y"]) mask.setAttribute(a, "-1");
        for (const a of ["width", "height"]) mask.setAttribute(a, "3");
        const all = document.createElementNS(NS, "rect");
        for (const [k2, v] of [["x", -1], ["y", -1], ["width", 3], ["height", 3], ["fill", "#fff"]]) all.setAttribute(k2, v);
        mask.append(all);
        for (const c of subs) {
          const hole = polygon(c);
          hole.setAttribute("fill", "#000");
          mask.append(hole);
        }
        clip.append(polygon(z));
        defs.append(mask, clip);
        outer.setAttribute("mask", `url(#${mask.id})`);
        poly.append(outer);
        for (const c of subs) {
          const hole = polygon(c, "hole");
          hole.setAttribute("clip-path", `url(#${clip.id})`);
          poly.append(hole);
        }
      } else poly.append(outer);
      svg.append(poly);
      const b = document.createElement("span");
      b.className = "badge";
      b.dataset.g = g;
      b.textContent = hs.length;
      const a = area(z.p);
      const mid = zoneMiddle(z, [...new Set(subs.concat(drawn.filter(o => o !== z && area(o.p) < a)))], (x, y) => !water(reserve, ax(x), ay(y)));
      b.style.left = atX(mid[0]);
      b.style.top = atY(mid[1]);
      // species of the zone: count and best medal
      const bySp = new Map();
      for (const h of hs) {
        const o = bySp.get(h.s) || { n: 0, rank: 4, rare: false };
        o.n++;
        if (level(h.rank) < level(o.rank)) o.rank = h.rank;
        o.rare = o.rare || h.rarity >= RARE_FUR;
        bySp.set(h.s, o);
      }
      if (bySp.size === 1) { b.dataset.s = [...bySp.keys()][0]; b.classList.add("link"); }
      const lines = [...bySp.entries()].sort((a, b) => b[1].n - a[1].n)
        .map(([s, o]) => (o.rare ? "★ " : "") + (d.species[s] || "?") + " ×" + o.n + " · " + rankName(o.rank, tiers));
      // its zone stands out while the badge is hovered
      hover(b, fmt(T.page_map_zone, hs.length), lines,
        () => { svg.classList.add("dim"); poly.classList.add("on"); },
        () => { svg.classList.remove("dim"); poly.classList.remove("on"); });
      badges.append(b);
      const pts = z.p.map(([x, y]) => [ax(x), ay(y)]);
      b.fit = [Math.min(...pts.map(p => p[0])), Math.min(...pts.map(p => p[1])), Math.max(...pts.map(p => p[0])), Math.max(...pts.map(p => p[1]))];
    }
  }
  // exact positions, oldest first so that the last harvests are on top
  const pins = $("mPins");
  pins.innerHTML = "";
  for (const h of onMap.sort((a, b) => a.t - b.t)) {
    const rare = h.rarity >= RARE_FUR;
    const p = document.createElement("span");
    p.className = "pin";
    p.dataset.k = h.t + "/" + h.s;
    p.dataset.s = h.s;
    p.at = [ax(h.x), ay(h.y)];
    p.style.left = atX(h.x);
    p.style.top = atY(h.y);
    p.append(speciesIcon(h.s, h.rank, rare));
    const lines = [rankName(h.rank, tiers) + " · " + h.score.toFixed(2)];
    if (h.fur) lines.push((rare ? "★ " : "") + h.fur);
    lines.push(date.format(new Date(h.t * 1000)));
    hover(p, d.species[h.s] || "?", lines);
    pins.append(p);
  }
  // the harvest asked for, once the regions are there: zoomed in, and pointed out for a while
  if (mapFocus && zonesCache[reserve]) {
    const f = mapFocus;
    mapFocus = null;
    // the map in sight, its filters just above
    $("mCount").scrollIntoView({ block: "start" });
    if (f.t !== undefined) {
      const h = d.harvests.find(h => h.t === f.t && h.s === f.s);
      mapHighlight = h && { key: placed(h) ? "p" + h.t + "/" + h.s : "g" + h.g, until: Date.now() + 6000, zoom: true };
    } else resetZoom();
  }
  if (mapHighlight && Date.now() < mapHighlight.until) {
    const k = mapHighlight.key, el = k[0] === "p" ? pins.querySelector(`[data-k="${k.slice(1)}"]`) : badges.querySelector(`[data-g="${k.slice(1)}"]`);
    if (el) {
      if (mapHighlight.zoom) {
        mapHighlight.zoom = false;
        const { w, h, s } = mapSize(), m = mapZoom;
        if (el.at) {
          m.z = Math.max(m.z, 5);
          m.x = w / 2 - el.at[0] * s * m.z;
          m.y = h / 2 - el.at[1] * s * m.z;
          applyZoom();
        } else {
          resetZoom(el.fit);
        }
      }
      el.classList.add("focus");
      setTimeout(() => el.dispatchEvent(new MouseEvent("mouseenter")));
    }
  }
}

/* ---- preview: the wall on a 1280x720 HUD, as the mod lays it out ---- */
const TINT = ["#9EE9FF", "#FFC42E", "#F2F2F2", "#E69240"];
// classes of the 126 species, in wall order (counts per class as in the game)
const CLASSES = [].concat(...[[1, 27], [2, 16], [3, 18], [4, 17], [5, 16], [6, 12], [7, 8], [8, 6], [9, 6]].map(([c, n]) => Array(n).fill(c)));
// a fixed, irregular set of results so the preview looks like a real hunting log
const RANKS = CLASSES.map((c, i) => { const r = (i * 37 + c * 11) % 17; return r < 3 ? 0 : r < 9 ? 1 : r < 11 ? 2 : r < 12 ? 3 : 4; });
const HERE = CLASSES.map((c, i) => (i * 7 + 3) % 11 < 2);
// the species of Vurhonga Savanna, for the reserve wall
const RESERVE = {
  fr: ["CANARD SIFFLEUR", "LIÈVRE DES BUISSONS", "CHACAL À FLANCS RAYÉS", "SPRINGBOK", "PETIT KOUDOU", "PHACOCHÈRE", "GEMSBOK", "GNOU BLEU", "BUFFLE DU CAP", "LION"],
  en: ["EURASIAN WIGEON", "SCRUB HARE", "SIDE-STRIPED JACKAL", "SPRINGBOK", "LESSER KUDU", "WARTHOG", "GEMSBOK", "BLUE WILDEBEEST", "CAPE BUFFALO", "LION"],
  ranks: [4, 1, 1, 1, 2, 4, 1, 3, 4, 0],
  cls: [1, 1, 2, 3, 4, 4, 6, 6, 9, 9],
};
const MEDAL = ["#8FE3FF", "#FFC42E", "#E2E2E2", "#C87A35"];

function hexPath(g, x, y, w, h) {
  const p = [[.5, 0], [1, .25], [1, .75], [.5, 1], [0, .75], [0, .25]];
  g.beginPath();
  p.forEach(([a, b], i) => i ? g.lineTo(x + w * a, y + h * b) : g.moveTo(x + w * a, y + h * b));
  g.closePath();
}

function num(k) { const v = parseFloat(values[k]); return isNaN(v) ? parseFloat(data.fields.find(f => f.key === k).default) : v; }

function draw() {
  if (!data) return;
  const cv = $("cv"), box = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(box.width * dpr); cv.height = Math.round(box.height * dpr);
  const g = cv.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, cv.width, cv.height);
  if (values.wall === "0") {
    g.setTransform(cv.width / 1280, 0, 0, cv.width / 1280, 0, 0);
    drawTimer(g);
    return;
  }
  const list = isList();
  const b = list ? gridBounds() : megaBounds();
  const pos = place(b);
  $("zoneNote").hidden = pos.x === num("wallX") && pos.y === num("wallY");
  // zoom: the wall and a margin, keeping the 16:9 frame
  let vx = 0, vy = 0, vw = 1280;
  if ($("v_zoom").checked) {
    vw = Math.min(1280, Math.max(b.w + 60, (b.h + 60) * 16 / 9));
    vx = Math.max(0, Math.min(1280 - vw, pos.x - 30)); vy = Math.max(0, pos.y - 30);
  }
  const s = cv.width / vw;
  g.setTransform(s, 0, 0, s, -vx * s, -vy * s);
  drawPanels(g);
  const target = parseInt(values.tier ?? "1"), higher = values.higher !== "0";
  const done = r => r === target || (higher && r < target);
  g.save();
  g.translate(pos.x, pos.y);
  if (list) drawGrid(g, done); else drawMega(g);
  $("listNote").hidden = !(values.wall === "list" && !list);
  g.restore();
  drawTimer(g);
}

// h:mm:ss of a number of seconds
function clock(sec) {
  sec = Math.max(0, Math.floor(sec));
  const p = n => String(n).padStart(2, "0");
  return Math.floor(sec / 3600) + ":" + p(Math.floor(sec / 60) % 60) + ":" + p(sec % 60);
}

// the challenge timer on the preview, as the mod draws it
function drawTimer(g) {
  if (values.timerOn !== "1") return;
  const k = num("timerScale") || 1, st = timerState, sub = values.timerSub !== "0";
  // size of the block, to place it from its corner as the mod does
  g.save();
  g.font = '600 30px "Barlow Condensed", sans-serif';
  const main = clock(st ? st.elapsed : 34 * 3600 + 12 * 60 + 5);
  let w = g.measureText(main + (st && st.paused ? "  II" : "")).width;
  const subText = clock(st ? st.since : 83 * 60 + 45) + "  " + (values.timerSubText ?? data.fields.find(f => f.key === "timerSubText").default);
  g.font = '600 17px "Barlow Condensed", sans-serif';
  if (sub) w = Math.max(w, 2 + g.measureText(subText).width);
  g.restore();
  const bw = w * k, bh = (sub ? 32 + 20 : 34) * k, corner = values.timerCorner || "bl";
  let x = corner[1] === "r" ? 1280 - bw - num("timerX") : num("timerX");
  let y = corner[0] === "b" ? 720 - bh - num("timerY") : num("timerY");
  x = Math.max(0, Math.min(x, 1280 - bw)); y = Math.max(0, Math.min(y, 720 - bh));
  g.save();
  g.translate(x, y);
  g.scale(k, k);
  g.textBaseline = "top";
  g.shadowColor = "rgba(0,0,0,.9)"; g.shadowOffsetY = 2; g.shadowBlur = 3;
  g.font = '600 30px "Barlow Condensed", sans-serif';
  g.fillStyle = st && st.paused ? "#9ba1a6" : "#ffffff";
  g.fillText(main, 0, 0);
  if (st && st.paused) {
    g.fillStyle = "#f3b24f";
    g.fillText("II", g.measureText(main).width + 8, 0);
  }
  if (sub) {
    g.font = '600 17px "Barlow Condensed", sans-serif';
    g.fillStyle = "#d8d4cc";
    g.fillText(subText, 2, 32);
  }
  g.restore();
}

/* ---- challenge timer: its state and actions, in the settings ---- */
let timerState = null;

function timerPanel() {
  const T = data.text, el = t => document.createElement(t);
  const box = el("div"); box.className = "field tpanel";
  const now = el("div"); now.className = "tnow"; now.id = "tNow";
  const r1 = el("div"); r1.className = "trow2";
  const lab = el("label"); lab.textContent = T.page_timer_setl; lab.htmlFor = "tSet";
  const inp = el("input"); inp.id = "tSet"; inp.placeholder = "34:12:05"; inp.inputMode = "numeric";
  const set = el("button"); set.type = "button"; set.className = "btn"; set.textContent = T.page_timer_set;
  r1.append(lab, inp, set);
  const r2 = el("div"); r2.className = "trow2";
  const est = el("button"); est.type = "button"; est.className = "btn"; est.id = "tEst"; est.textContent = T.page_timer_est;
  const pause = el("button"); pause.type = "button"; pause.className = "btn"; pause.id = "tPause";
  const reset = el("button"); reset.type = "button"; reset.className = "btn"; reset.textContent = T.page_timer_reset;
  r2.append(pause, est, reset);
  const msg = el("p"); msg.className = "help"; msg.id = "tMsg";
  box.append(now, r1, r2, msg);
  const act = (action, seconds) => fetch(api + "timer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, seconds }) })
    .then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(t)))
    .then(st => { timerState = st; showTimer(); draw(); })
    .catch(e => { $("tMsg").textContent = String(e).trim(); });
  set.onclick = () => {
    const m = /^\s*(\d+)(?::(\d{1,2}))?(?::(\d{1,2}))?\s*$/.exec(inp.value);
    if (!m) { $("tMsg").textContent = T.page_timer_bad; return; }
    act("set", (+m[1]) * 3600 + (+(m[2] || 0)) * 60 + (+(m[3] || 0)));
    inp.value = "";
  };
  est.onclick = () => { if (confirm(T.page_timer_estask)) act("estimate"); };
  pause.onclick = () => act("pause");
  reset.onclick = () => { if (confirm(T.page_timer_rstask)) act("reset"); };
  setTimeout(pollTimer);
  return box;
}

function showTimer() {
  const T = data.text, st = timerState, now = $("tNow");
  if (!now || !st) return;
  now.textContent = fmt(T.page_timer_now, clock(st.elapsed)) + (st.paused ? " (" + T.page_timer_paused + ")" : "");
  const sub = document.createElement("small");
  sub.textContent = values.timerOn === "1" ? fmt(T.page_timer_since, clock(st.since)) : T.page_timer_off;
  now.append(sub);
  $("tPause").textContent = st.paused ? T.page_timer_resume : T.page_timer_pause;
  // no estimate from "all time": the harvests known do not go back that far
  const est = $("tEst"), msg = $("tMsg");
  est.disabled = !values.since;
  est.title = est.disabled ? T.page_timer_estall : "";
  if (est.disabled && !msg.textContent) msg.textContent = T.page_timer_estall;
  else if (!est.disabled && msg.textContent === T.page_timer_estall) msg.textContent = "";
}

// the state of the timer, read again every second while the settings are shown
function pollTimer() {
  clearTimeout(pollTimer.next);
  if (document.body.dataset.tab === "settings" && $("tNow")) {
    fetch(api + "timer").then(r => r.ok ? r.json() : null).then(st => {
      if (st) { timerState = st; showTimer(); if (values.timerOn === "1") draw(); }
    }).catch(() => {});
  }
  pollTimer.next = setTimeout(pollTimer, 1000);
}

function icon(g, x, y, w, rank, alpha) {
  const h = w * 1.112;
  g.globalAlpha = alpha;
  hexPath(g, x, y, w, h);
  g.fillStyle = rank < 4 ? TINT[rank] : "#8b9096";
  g.fill();
  hexPath(g, x + w * .14, y + h * .14, w * .72, h * .72);
  g.fillStyle = rank < 4 ? "rgba(30,24,10,.55)" : "rgba(20,22,24,.7)";
  g.fill();
  g.globalAlpha = 1;
}

// top right corner of the HUD, taken by the binoculars and calls panels: the mod moves the wall out of it
const PANELS = { x: 960, y: 380 };

// position sliders: only the positions that keep the wall on screen and out of the panels corner
const sliders = {};

function limits() {
  const b = isList() ? gridBounds() : megaBounds();
  const xMax = Math.max(0, Math.floor((num("wallY") < PANELS.y ? PANELS.x : 1280) - b.w));
  const yMin = num("wallX") + b.w > PANELS.x ? PANELS.y : 0;
  return { wallX: { min: 0, max: xMax }, wallY: { min: yMin, max: Math.max(yMin, Math.floor(720 - b.h)) } };
}

function updateLimits() {
  const L = limits();
  for (const k of ["wallX", "wallY"]) {
    const sl = sliders[k];
    if (!sl) continue;
    for (const e of [sl.r, sl.n]) { e.min = L[k].min; e.max = L[k].max; }
    const v = Math.min(L[k].max, Math.max(L[k].min, num(k)));
    if (v !== num(k)) values[k] = String(v);
    sl.r.value = v;
    if (document.activeElement !== sl.n) sl.n.value = v;
  }
}

function place(b) {
  let x = num("wallX"), y = num("wallY");
  if (y < PANELS.y && x + b.w > PANELS.x) {
    if (PANELS.x - b.w >= 0) x = PANELS.x - b.w; else y = PANELS.y;
  }
  return { x, y };
}

function drawPanels(g) {
  g.save();
  g.fillStyle = "rgba(236,154,30,.07)";
  g.fillRect(PANELS.x, 0, 1280 - PANELS.x, PANELS.y);
  g.setLineDash([8, 6]); g.lineWidth = 2; g.strokeStyle = "rgba(236,154,30,.55)";
  g.strokeRect(PANELS.x + 1, 1, 1280 - PANELS.x - 2, PANELS.y - 2);
  g.fillStyle = "rgba(236,154,30,.8)"; g.font = "600 20px 'Barlow Condensed', sans-serif";
  g.textAlign = "center"; g.textBaseline = "middle";
  g.fillText(data.text.page_panels, PANELS.x + (1280 - PANELS.x) / 2, PANELS.y / 2, 1280 - PANELS.x - 20);
  g.restore();
}

// list with names: only when the overlay shows one reserve (not in 100% mode with every species)
function isList() {
  return values.wall === "list" && !(values.scope !== "reserve" && values.megaWall !== "0");
}

// medal counted for the challenge
function doneFn() {
  const target = parseInt(values.tier ?? "1"), higher = values.higher !== "0";
  return r => r === target || (higher && r < target);
}

// species shown with the icons layout: every species (100% mode), or those of the reserve
function megaSet() {
  const done = doneFn();
  if (values.scope !== "reserve" && values.megaWall !== "0") {
    return { cls: CLASSES, ranks: RANKS, here: HERE, perRow: Math.ceil(126 / Math.max(1, num("megaRows"))),
      all: 126, done: RANKS.filter(done).length, reserve: false };
  }
  const list = reserveList(done);
  return { cls: list.map(sp => sp.cls), ranks: list.map(sp => sp.rank), here: null, perRow: Math.max(1, num("perRow")),
    all: RESERVE.ranks.length, done: RESERVE.ranks.filter(done).length, reserve: true };
}

// icon size, space and class number size: reserve mode scales them to reserveSize, not the gauge
function iconMetrics(set) {
  const k = set.reserve ? num("reserveSize") / Math.max(1, num("megaSize")) : 1;
  return { size: num("megaSize") * k, gap: num("megaGap") * k, cls: num("classSize") * k };
}

function megaBounds() {
  const set = megaSet(), M = iconMetrics(set);
  const size = M.size, gap = M.gap, gs = num("gaugeSize");
  const h1 = size * 1.112, perRow = set.perRow;
  let x = 0, maxX = 0, col = 0, last = -1, y = 0;
  set.cls.forEach(c => {
    if (col === perRow) { col = 0; x = 0; y += h1 + gap + 3; }
    if (values.classes !== "0" && c !== last) { x += Math.max(M.cls * .6 + gap, size * .45); last = c; }
    x += size + gap; maxX = Math.max(maxX, x); col++;
  });
  const extra = set.reserve && values.total === "1" ? num("nameSize") * 1.4 : 0;
  return { w: 6 + gs * 1.2 + 10 + maxX + 14, h: Math.max(6 + y + h1 + 12, 6 + gs * 1.112 + num("nameSize") + extra + 12) + 2 };
}

function reserveList(done) {
  const names = RESERVE[data.lang] || RESERVE.en;
  return names.map((n, i) => ({ name: n, rank: RESERVE.ranks[i], cls: RESERVE.cls[i] })).filter(sp => !(values.missing === "1" && done(sp.rank)));
}

// icon grid of the reserve wall, as the mod lays it out: class numbers before each class
// the reserve overlay is laid out at icon size 44, then scaled to iconSize
const BASE = 44;
const gridScale = () => num("iconSize") / BASE;

function gridLayout(g, list) {
  const size = BASE, perRow = Math.max(1, num("perRow")), classes = values.classes === "1";
  g.font = "400 15px Barlow, sans-serif";
  const cells = []; let x = 10, y = 8, col = 0, last = -1, maxX = 0;
  for (const sp of list) {
    if (col === perRow) { col = 0; x = 10; y += size * 1.112 + 6; }
    if (classes && sp.cls !== last) { cells.push({ t: sp.cls, x: x + 2, y: y + size * .3 }); x += g.measureText(String(sp.cls)).width + 8; last = sp.cls; }
    cells.push({ sp, x, y }); x += size + 6; maxX = Math.max(maxX, x); col++;
  }
  return { cells, w: maxX + 4, h: list.length ? y + size * 1.112 + 8 : 8 };
}

function gridBounds() {
  const n = RESERVE.ranks.length, k = gridScale();
  if (values.wall === "list") return { w: 320 * k, h: (34 + 8 + n * 36) * k };
  const L = gridLayout($("cv").getContext("2d"), reserveList(() => false));
  return { w: Math.max(300, L.w) * k, h: (34 + L.h) * k };
}

function drawMega(g) {
  const set = megaSet(), M = iconMetrics(set);
  const size = M.size, gap = M.gap;
  const gs = num("gaugeSize"), att = num("attenue"), avant = values.avant !== "0" && !set.reserve;
  const h1 = size * 1.112, colW = gs * 1.2;
  const perRow = set.perRow;
  const n = set.done;
  // body layout first, for the background size
  const cells = []; let x = 0, y = 0, col = 0, last = -1, maxX = 0;
  set.cls.forEach((c, i) => {
    if (col === perRow) { col = 0; x = 0; y += h1 + gap + 3; }
    if (values.classes !== "0" && c !== last) { cells.push({ t: c, x, y }); x += Math.max(M.cls * .6 + gap, size * .45); last = c; }
    cells.push({ i, x, y }); x += size + gap; maxX = Math.max(maxX, x); col++;
  });
  // icons and badge column aligned at the top, centre or bottom, as the mod
  const ns = num("nameSize"), colH = gs * 1.112; // the badge only, not the texts under it
  const bodyH = set.cls.length ? y + h1 : 0, align = (values.iconsAlign || "auto") === "auto" ? (set.reserve ? "center" : "top") : values.iconsAlign;
  const shift = align === "top" ? 0 : (colH - bodyH) * (align === "bottom" ? 1 : .5);
  const bx = 6 + colW + 10, by = 6 + Math.max(0, shift), cy = Math.max(0, -shift);
  if (values.bg === "1") { g.fillStyle = "rgba(0,0,0," + num("bgAlpha") + ")"; g.fillRect(0, 0, bx + maxX + 6, Math.max(by + y + h1 + 12, cy + 6 + colH + 2 + ns * 1.4 * (set.reserve && values.total === "1" ? 2 : 1) + 12)); }
  // gauge
  const gx = 6 + (colW - gs) / 2, gy = 6 + cy, gh = gs * 1.112, pct = Math.round(100 * n / set.all);
  hexPath(g, gx, gy, gs, gh); g.fillStyle = "rgba(0,0,0,.72)"; g.fill();
  g.save(); hexPath(g, gx, gy, gs, gh); g.clip(); g.fillStyle = "rgba(255,196,46,.9)"; g.fillRect(gx, gy + gh * (1 - pct / 100), gs, gh); g.restore();
  g.lineWidth = gs * .025; g.strokeStyle = "#FFC42E"; hexPath(g, gx + gs * .03, gy + gs * .03, gs * .94, gh - gs * .06); g.stroke();
  g.fillStyle = "#fff"; g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "600 " + Math.round(gh * .27) + "px Barlow, sans-serif"; g.fillText(pct + "%", gx + gs / 2, gy + gh * .47);
  g.font = "400 " + Math.round(gh * .13) + "px Barlow, sans-serif"; g.fillText(n + "/" + set.all, gx + gs / 2, gy + gh * .7);
  g.font = "600 " + num("nameSize") + "px Barlow, sans-serif"; g.fillText(data.lang === "fr" ? "SAVANE DE VURHONGA" : "VURHONGA SAVANNA", 6 + colW / 2, gy + gh + 2 + num("nameSize") * .7, colW);
  if (set.reserve && values.total === "1") g.fillText((values.totalText || "GLOBAL") + " " + RANKS.filter(doneFn()).length + "/126", 6 + colW / 2, gy + gh + 2 + num("nameSize") * 2.1, colW);
  // icons
  g.save(); g.translate(bx, by);
  for (const c of cells) {
    if (c.t) { g.fillStyle = "rgba(232,236,242,.8)"; g.font = "600 " + M.cls + "px Barlow, sans-serif"; g.fillText(c.t, c.x + (Math.max(M.cls * .6 + gap, size * .45) - gap) / 2, c.y + h1 / 2); continue; }
    const here = set.here ? set.here[c.i] : true;
    const k = avant ? (here ? 1.12 : .9) : 1;
    const w = size * k, ox = c.x + (size - w) / 2, oy = c.y + (h1 - w * 1.112) / 2;
    icon(g, ox, oy, w, set.ranks[c.i], avant && !here ? att : 1);
  }
  g.restore();
}

function drawGrid(g, done) {
  g.save();
  g.scale(gridScale(), gridScale());
  drawGridBase(g, done);
  g.restore();
}

function drawGridBase(g, done) {
  const list = reserveList(done), all = RESERVE.ranks.length;
  const tiers = (values.tiers || "").split(","), target = parseInt(values.tier ?? "1");
  const got = RESERVE.ranks.filter(done).length;
  let right = (tiers[target] || "") + " " + got + "/" + all;
  if (values.missing === "1" && list.length) right += "  \u00b7  " + (values.leftText || "") + " " + list.length;
  if (values.total === "1") right += "  \u00b7  " + (values.totalText || "GLOBAL") + " " + RANKS.filter(done).length + "/126";
  const title = data.lang === "fr" ? "SAVANE DE VURHONGA" : "VURHONGA SAVANNA";
  g.font = "600 20px 'Barlow Condensed', sans-serif";
  const probe = g.measureText(title + "    " + right).width + 20;
  let w, h;
  if (values.wall === "list") {
    g.font = "400 17px Barlow, sans-serif";
    const names = Math.max(0, ...list.map(sp => g.measureText(sp.name).width));
    w = Math.max(320, 50 + names + 90, probe); h = 8 + list.length * 36;
  } else {
    var L = gridLayout(g, list);
    w = Math.max(300, L.w, probe); h = L.h;
  }
  g.fillStyle = "#FF9800"; g.fillRect(0, 0, w, 34);
  g.fillStyle = "rgba(0,0,0,.55)"; g.fillRect(0, 34, w, h);
  g.fillStyle = "#fff"; g.font = "600 20px 'Barlow Condensed', sans-serif"; g.textBaseline = "middle";
  g.textAlign = "left"; g.fillText(title, 10, 18);
  g.textAlign = "right"; g.fillText(right, w - 10, 18);
  g.textAlign = "left";
  if (values.wall === "list") {
    list.forEach((sp, n) => {
      const y = 34 + 8 + n * 36;
      icon(g, 10, y, 30, sp.rank, 1);
      g.fillStyle = "#fff"; g.font = "400 17px Barlow, sans-serif"; g.fillText(sp.name, 50, y + 5 + 11);
      g.textAlign = "right"; g.font = "600 16px Barlow, sans-serif";
      g.fillStyle = sp.rank < 4 ? MEDAL[sp.rank] : "#888";
      g.fillText(sp.rank < 4 ? (tiers[sp.rank] || "") : "\u2013", w - 10, y + 6 + 11);
      g.textAlign = "left";
    });
    return;
  }
  const size = BASE;
  g.textBaseline = "top";
  for (const c of L.cells) {
    if (c.sp) { icon(g, c.x, 34 + c.y, size, c.sp.rank, 1); continue; }
    g.fillStyle = "#E8ECF2"; g.font = "400 15px Barlow, sans-serif"; g.fillText(c.t, c.x, 34 + c.y);
  }
  g.textBaseline = "middle";
}

window.addEventListener("resize", draw);
document.fonts && document.fonts.ready.then(draw);
</script>
