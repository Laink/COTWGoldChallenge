<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COTWGoldChallenge</title>
<style>
@font-face { font-family: "Barlow"; src: url("fonts/barlow-latin-400-normal.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Barlow"; src: url("fonts/barlow-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "Barlow Condensed"; src: url("fonts/barlow-condensed-latin-600-normal.woff2") format("woff2"); font-weight: 600; font-display: swap; }

:root {
  --bg: #141618;
  --panel: #1c1f22;
  --panel-2: #23272b;
  --line: #2f3439;
  --text: #e9e6df;
  --muted: #9ba1a6;
  --accent: #ec9a1e;
  --accent-ink: #1a1307;
  --focus: #f3b24f;
  --radius: 2px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body { font: 400 15px/1.5 "Barlow", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
h1, h2, .banner, .seg label, .btn { font-family: "Barlow Condensed", "Barlow", sans-serif; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }

.top { display: flex; align-items: baseline; gap: 16px; padding: 22px 32px 18px; border-bottom: 1px solid var(--line); }
.top h1 { margin: 0; font-size: 26px; }
.top .mark { color: var(--accent); }
.top .credit { color: var(--muted); font-size: 14px; }

.layout { display: grid; grid-template-columns: minmax(0, 620px) minmax(0, 1fr); gap: 40px; padding: 28px 32px 120px; max-width: 1400px; }
@media (max-width: 1000px) { .layout { grid-template-columns: 1fr; } .side { position: static; } }

.intro { color: var(--muted); margin: 0 0 28px; max-width: 60ch; }

section { margin-bottom: 30px; }
.banner { display: block; background: var(--accent); color: var(--accent-ink); font-size: 17px; padding: 5px 12px; border-radius: var(--radius) var(--radius) 0 0; }
.group { background: var(--panel); border: 1px solid var(--line); border-top: 0; border-radius: 0 0 var(--radius) var(--radius); }
.field { padding: 16px 18px; border-top: 1px solid var(--line); }
.field:first-child { border-top: 0; }
.field > .label { display: block; font-weight: 600; margin-bottom: 8px; }
.field .help { color: var(--muted); font-size: 13.5px; margin-top: 7px; }
.field.inline { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; }
.field.inline > .label { margin: 0; }
.field.inline .help { grid-column: 1 / -1; margin-top: -6px; }

/* choices as game tabs */
.seg { display: flex; flex-direction: column; gap: 6px; }
.seg.row { flex-direction: row; flex-wrap: wrap; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { display: block; cursor: pointer; padding: 8px 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); font-size: 15px; letter-spacing: .03em; text-transform: none; font-family: "Barlow", sans-serif; font-weight: 400; color: var(--text); }
.seg.row label { font-family: "Barlow Condensed", sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; min-width: 72px; text-align: center; }
.seg label:hover { border-color: #4a5157; }
.seg input:checked + label { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); background: #2a2621; }
.seg.row input:checked + label { box-shadow: inset 0 -3px 0 var(--accent); }
.seg input:focus-visible + label { outline: 2px solid var(--focus); outline-offset: 1px; }

/* toggle */
.toggle { position: relative; width: 46px; height: 24px; }
.toggle input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.toggle span { position: absolute; inset: 0; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); transition: background .15s; }
.toggle span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; background: var(--muted); border-radius: 1px; transition: transform .15s, background .15s; }
.toggle input:checked + span { background: #3a2c14; border-color: var(--accent); }
.toggle input:checked + span::after { transform: translateX(22px); background: var(--accent); }
.toggle input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 1px; }

/* inputs */
input[type=number], input[type=text], input[type=date], input[type=time] {
  font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px; color-scheme: dark;
}
input[type=number] { width: 96px; }
input[type=text] { width: 100%; }
input:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.range { display: flex; align-items: center; gap: 14px; }
.range input { flex: 1; accent-color: var(--accent); }
.range input[type=number] { flex: 0 0 96px; }
.range output { font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; color: var(--muted); }
.date { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.date .time { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13.5px; }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.date.off input[type=date], .date.off input[type=time] { opacity: .35; pointer-events: none; }

details.adv { margin-top: 10px; border-top: 1px solid var(--line); }
details.adv > summary { cursor: pointer; list-style: none; padding: 16px 0; font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 18px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
details.adv > summary::-webkit-details-marker { display: none; }
details.adv > summary::before { content: "+"; display: inline-block; width: 18px; color: var(--accent); }
details.adv[open] > summary::before { content: "\2212"; }
details.adv[open] > summary { color: var(--text); }

/* preview */
.side { position: sticky; top: 24px; align-self: start; }
.side h2 { font-size: 17px; margin: 0 0 10px; color: var(--muted); }
.screen { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #0d0f10 linear-gradient(180deg, #222a2e 0%, #1a2022 55%, #202419 56%, #171a13 100%); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.screen canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.side .note { color: var(--muted); font-size: 13px; margin-top: 8px; }

/* save bar */
.bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 14px 32px; background: rgba(20, 22, 24, .96); border-top: 1px solid var(--line); }
.bar .status { flex: 1; color: var(--muted); }
@media (max-width: 700px) { .bar { flex-wrap: wrap; padding: 12px 16px; } .bar .status { flex-basis: 100%; } .layout, .top { padding-left: 16px; padding-right: 16px; } }
.side .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.side .head h2 { margin: 0; }
.side .seg.row label { min-width: 0; padding: 4px 10px; font-size: 14px; }
.status.ok { color: #9fcf8a; }
.status.err { color: #f08a7a; }
.btn { cursor: pointer; font-size: 16px; padding: 9px 18px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--panel-2); color: var(--text); white-space: nowrap; }
.btn:hover { border-color: #4a5157; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { background: #f4a633; }
.btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.closed { display: none; padding: 80px 32px; font-size: 18px; color: var(--muted); }
body.is-closed .top, body.is-closed .layout, body.is-closed .bar { display: none; }
body.is-closed .closed { display: block; }
.foot { color: var(--muted); font-size: 12.5px; margin-top: 36px; }
.keybind { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.keycap { min-width: 64px; padding: 6px 12px; text-align: center; background: var(--panel-2); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: var(--radius); font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 17px; letter-spacing: .05em; }
.keycap.wait { border-color: var(--accent); color: var(--focus); font-family: "Barlow", sans-serif; font-weight: 400; font-size: 14px; letter-spacing: 0; }
.keycap.none { color: var(--muted); }
.keybind .btn { font-size: 14px; padding: 6px 12px; }

/* tabs */
.tabs { display: flex; gap: 4px; margin-left: 24px; align-self: flex-end; }
@media (max-width: 700px) { .top { flex-wrap: wrap; } .tabs { margin-left: -16px; flex-basis: 100%; } }
.tab { cursor: pointer; font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 17px; letter-spacing: .05em; text-transform: uppercase; padding: 6px 16px; background: none; border: 1px solid transparent; border-bottom: 3px solid transparent; color: var(--muted); }
.tab:hover { color: var(--text); }
.tab.on { color: var(--text); border-bottom-color: var(--accent); }
.tab:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
body:not([data-tab="settings"]) .layout, body:not([data-tab="settings"]) .bar { display: none; }
.troph, .stats, .mapview, .album { display: none; padding: 28px 32px 80px; max-width: 1100px; }
body[data-tab="trophies"] .troph, body[data-tab="stats"] .stats, body[data-tab="map"] .mapview, body[data-tab="album"] .album { display: block; }
body.is-closed .troph, body.is-closed .stats, body.is-closed .mapview, body.is-closed .album { display: none; }
h3.sub { font-family: "Barlow Condensed", sans-serif; font-weight: 600; font-size: 19px; letter-spacing: .04em; text-transform: uppercase; margin: 30px 0 4px; }

/* overview: one card per reserve */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin: 12px 0 14px; }
.card { text-align: left; cursor: pointer; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; color: var(--text); font: inherit; }
.card:hover { border-color: #4a5157; }
.card.on { border-color: var(--accent); }
.card.global { background: #2a2621; cursor: default; }
.card:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.card .cn { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; font-weight: 600; line-height: 1.3; min-height: 2.6em; }
.card .cv { color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.meter { height: 4px; background: var(--panel-2); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.card.done .meter i { background: #9fcf8a; }
details.miss { margin: 0 0 8px; }
details.miss > summary { font-size: 16px; padding: 10px 0; }
.mrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px 14px; border-top: 1px solid var(--line); }
.mrow:first-child { border-top: 0; }
.mrow .name { font-weight: 600; margin-right: 4px; }
.chip { cursor: pointer; font: inherit; font-size: 13px; padding: 2px 8px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); color: var(--text); }
.chip:hover { border-color: var(--accent); }
.chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

/* statistics */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 16px 0 26px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.tile b { display: block; font: 600 32px/1.1 "Barlow Condensed", sans-serif; font-variant-numeric: tabular-nums; }
.tile span { color: var(--muted); font-size: 13.5px; }
.sgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 0 24px; }
.hrow { display: grid; grid-template-columns: minmax(0, 160px) minmax(0, 1fr) 64px; gap: 10px; align-items: center; padding: 6px 14px; border-top: 1px solid var(--line); }
.hrow:first-child { border-top: 0; }
.wide .hrow { grid-template-columns: minmax(0, 320px) minmax(0, 1fr) 64px; }
.hrow .hl { display: flex; align-items: center; gap: 8px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.hrow .ht i { display: block; height: 10px; min-width: 2px; border-radius: 0 4px 4px 0; background: var(--accent); }
.hrow .hv { text-align: right; color: var(--muted); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.sw { flex: none; width: 12px; height: 13px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); }
table.recent { width: 100%; border-collapse: collapse; font-size: 14px; }
table.recent th { text-align: left; color: var(--muted); font-weight: 400; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; padding: 8px 14px; }
table.recent td { padding: 7px 14px; border-top: 1px solid var(--line); }
table.recent .num { text-align: right; font-variant-numeric: tabular-nums; }
.tablewrap { overflow-x: auto; }
/* map of the harvests */
.mapbox { position: relative; width: 100%; max-width: 1024px; aspect-ratio: 1; margin-top: 8px; background: #0b0c0d; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.mapbox { touch-action: none; cursor: grab; user-select: none; }
.mapbox.drag { cursor: grabbing; }
.mapbox:fullscreen { max-width: none; aspect-ratio: auto; margin: 0; border: 0; border-radius: 0; }
.mapbox .mapinner { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; }
.mapbox img { display: block; width: 100%; height: 100%; }
/* medal thresholds under the name of a species */
.trow .thr { display: block; color: var(--muted); font-weight: 400; font-size: 12.5px; margin-top: 2px; }
.trow .name > b, .sp-open { cursor: pointer; }
.trow .name > b:hover, .sp-open:hover { color: var(--focus); }
/* album of the rare furs */
.agrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; margin-top: 10px; }
.acard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.acard h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; font: 600 15px "Barlow", sans-serif; }
.acard h3 .icon, .acard h3 .hex, .acard h3 .rare { width: 24px; height: 26px; }
.acard h3 small { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 12.5px; }
.afur { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; font: inherit; font-size: 13.5px; padding: 5px 8px; margin-top: 4px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); color: var(--muted); cursor: pointer; }
.afur:hover { border-color: var(--accent); }
.afur .st { width: 14px; text-align: center; }
.afur.got, .afur.hand { color: var(--text); }
.afur.got { border-color: #5b6066; }
.afur.got .st { color: #fff; }
.afur.hand { border-style: dashed; border-color: #5b6066; }
.afur.hand .st { color: var(--focus); }
.afur small { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
.afur.got:hover { border-color: #5b6066; cursor: default; }
#aSearch { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px; min-width: 220px; }
/* species sheet */
.sheet { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.66); display: flex; align-items: flex-start; justify-content: center; overflow: auto; overscroll-behavior: contain; padding: 40px 16px; }
.sheet[hidden] { display: none; }
/* the page under an open sheet stays still; the sheet keeps its place, its content scrolls */
html:has(.sheet:not([hidden])) { overflow: hidden; }
.sheetbox { position: relative; width: min(920px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px 26px; }
/* the scrollbar runs near the edge of the frame, clear of the content and of the close button */
#sheet .sheetbox { padding-right: 6px; }
#sheetBody { min-height: 0; overflow: auto; overscroll-behavior: contain; padding-right: 16px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
#sheet .sheetx { right: 20px; }
.recapbox { overflow: auto; }
.sheetx { position: absolute; top: 10px; right: 12px; width: 34px; height: 34px; cursor: pointer; font-size: 22px; line-height: 1; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); }
.sheetx:hover { border-color: var(--accent); }
.sheethead { display: flex; align-items: center; gap: 12px; margin: 0 40px 14px 0; }
.sheethead .icon, .sheethead .hex, .sheethead .rare { width: 44px; height: 48px; }
.sheethead h2 { margin: 0; font-size: 24px; }
.sheethead small { display: block; color: var(--muted); font-size: 14px; }
.thrs { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
.thrs span { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); font-size: 13.5px; }
.thrs .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }
.sheet section { margin-top: 16px; }
.recapbox { width: min(1240px, 100%); }
#recapCv { display: block; width: 100%; height: auto; border: 1px solid var(--line); }
/* links to the map: a dot for an exact position, a dashed ring for an estimated zone */
.maplink { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.maplink:hover { color: var(--focus); text-decoration: underline; text-underline-offset: 3px; }
.maplink svg { width: 12px; height: 12px; flex: none; color: var(--muted); }
.maplink.exact svg { color: var(--accent); }
.hrow.link { cursor: pointer; }
.hrow.link:hover .hl { color: var(--focus); }
.mapbox .pin.focus::after { content: ""; position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border: 2px solid var(--focus); border-radius: 50%; pointer-events: none; opacity: 0; animation: ping 1.2s ease-out 4; }
@keyframes ping { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
/* timer of the challenge: its state and actions, under its settings */
.tpanel .tnow { font: 600 22px "Barlow Condensed", sans-serif; letter-spacing: .03em; font-variant-numeric: tabular-nums; }
.tpanel .tnow small { display: block; font: 400 14px "Barlow", sans-serif; color: var(--muted); letter-spacing: 0; }
.tpanel .trow2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
.tpanel input { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 7px 10px; width: 120px; font-variant-numeric: tabular-nums; }
.mapbox .badge.focus { border-style: solid; box-shadow: 0 0 0 3px rgba(243,178,79,.45); }
/* filters of the map */
.mfilters { display: grid; gap: 8px; margin: 2px 0 8px; }
.mfrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.mflabel { min-width: 92px; color: var(--muted); font: 600 14px "Barlow Condensed", sans-serif; letter-spacing: .05em; text-transform: uppercase; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; flex: 1; }
.fchip { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; font: inherit; font-size: 13.5px; padding: 2px 8px 2px 5px; background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); color: var(--text); }
.fchip:hover { border-color: var(--accent); }
.fchip:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
.fchip.off { opacity: .38; }
.fchip .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }
.fchip .icon, .fchip .hex { width: 18px; height: 20px; }
.fchip small { color: var(--muted); font-size: 12px; }
.fchip.link { padding: 2px 8px; color: var(--muted); }
.mdates input { font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 8px; color-scheme: dark; }
/* zoom tiles of the game over the map, the finer level on top */
.mapbox #mTiles { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.mapbox #mTiles img { position: absolute; }
.mapctl { position: absolute; z-index: 4; top: 10px; right: 10px; display: flex; flex-direction: column; gap: 4px; }
.mapctl button { width: 34px; height: 34px; cursor: pointer; font: 600 19px/1 "Barlow", sans-serif; color: var(--text); background: rgba(20,22,24,.9); border: 1px solid var(--line); border-radius: var(--radius); }
.mapctl button:hover { border-color: var(--accent); }
/* pins and badges keep their size on screen whatever the zoom */
.mapbox .pin { position: absolute; transform: translate(-50%, -50%) scale(var(--inv, 1)); cursor: pointer; filter: drop-shadow(0 1px 2px rgba(0,0,0,.9)); }
.mapbox .pin .icon, .mapbox .pin .hex { width: 24px; height: 26px; }
.mapbox .pin:hover, .mapbox .pin:focus-visible { z-index: 2; outline: none; transform: translate(-50%, -50%) scale(calc(1.35 * var(--inv, 1))); }
.maptip { position: absolute; z-index: 3; pointer-events: none; background: rgba(20,22,24,.96); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 10px; font-size: 13.5px; line-height: 1.45; white-space: nowrap; }
.maptip b { display: block; font-size: 14.5px; }
/* estimated zones: harvests of the hunting log, known by their region only */
.mapbox.loading #mPins, .mapbox.loading #mBadges, .mapbox.loading svg.zones { visibility: hidden; }
.mapbox svg.zones { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.mapbox svg.zones .zone polygon { fill: rgba(236,154,30,.07); stroke: rgba(243,178,79,.9); stroke-width: 1.5; stroke-dasharray: 5 4; vector-effect: non-scaling-stroke; transition: fill .12s; }
.mapbox svg.zones .zone polygon.hole { fill: none; stroke: rgba(243,178,79,.45); stroke-width: 1; }

.ttable { display: grid; grid-template-columns: 30px minmax(0, 1fr) 170px auto; column-gap: 14px; }

.trow { border-top: 1px solid var(--line); }

.hex { display: inline-block; flex: none; width: 26px; height: 29px; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: #8b9096; }

<script>
"use strict";
const api = "api/";
let data, values = {}, saved = "";
const $ = id => document.getElementById(id);

fetch(api + "settings").then(r => r.json()).then(d => {
  data = d;
  values = Object.assign({}, d.values);
  saved = JSON.stringify(values);
  document.documentElement.lang = d.lang;
  const T = d.text;
  $("credit").textContent = d.lang === "fr" ? "conçu par Laink" : "designed by Laink";
  $("title").textContent = T.page_title;
  $("intro").textContent = T.page_intro;
  $("advTitle").textContent = T.page_advanced;
  $("previewTitle").textContent = T.page_preview;
  $("previewNote").textContent = T.page_preview_note;
  $("l_zoom").textContent = T.page_zoom;
  $("listNote").textContent = T.page_list_note;
  $("zoneNote").textContent = T.page_zone_note;
  $("l_full").textContent = T.page_full;
  $("v_zoom").onchange = $("v_full").onchange = draw;
  $("reset").textContent = T.page_reset;
  $("close").textContent = T.page_close;
  $("closed").textContent = T.page_closed;
  $("foot").textContent = "COTWGoldChallenge " + d.version;
  $("tabSettings").textContent = T.page_tab_settings;
  $("tabTrophies").textContent = T.page_tab_trophies;
  $("tTitle").textContent = T.page_trophies;
  $("tKeep").textContent = T.page_keep_open;
  $("tIntro").textContent = T.page_troph_intro;
  $("tResLabel").textContent = T.page_reserve;
  $("tDetected").textContent = T.page_detected;
  $("tByHand").textContent = T.page_by_hand;
  $("oTitle").textContent = T.page_overview;
  $("tDetail").textContent = T.page_by_species;
  $("tabStats").textContent = T.page_tab_stats;
  $("sTitle").textContent = T.page_tab_stats;
  $("sNote").textContent = T.page_stats_note;
  $("sL_since").textContent = T.page_stats_since;
  $("sL_all").textContent = T.page_stats_all;
  $("sMedalsT").textContent = T.page_medals;
  $("sResT").textContent = T.page_by_reserve;
  $("sTopT").textContent = T.page_top_species;
  $("sRecentT").textContent = T.page_recent;
  $("tabMap").textContent = T.page_tab_map;
  $("tabAlbum").textContent = T.page_tab_album;
  $("aTitle").textContent = T.page_tab_album;
  $("aNote").textContent = T.page_album_note;
  $("aSearch").placeholder = T.page_album_find;
  $("aL_all").textContent = T.page_album_all;
  $("aL_since").textContent = T.page_stats_since;
  $("aL_ever").textContent = T.page_stats_all;
  $("aL_have").textContent = T.page_album_have;
  $("aL_miss").textContent = T.page_album_miss;
  $("sheetX").setAttribute("aria-label", T.page_sheet_close);
  $("recapX").setAttribute("aria-label", T.page_sheet_close);
  $("sRecap").textContent = T.page_recap_open;
  $("rL_all").textContent = T.page_recap_all;
  $("rL_sess").textContent = T.page_recap_sess;
  $("rPng").textContent = T.page_recap_png;
  $("mTitle").textContent = T.page_tab_map;
  $("mNote").textContent = T.page_map_note;
  $("mResLabel").textContent = T.page_reserve;
  $("mSpLabel").textContent = T.page_col_species;
  $("mMedalsLabel").textContent = T.page_medals;
  $("mFurLabel").textContent = T.page_col_fur;
  $("mL_dates").textContent = T.page_map_dates;
  $("mToLabel").textContent = T.page_map_to;
  $("mL_since").textContent = T.page_stats_since;
  $("mL_all").textContent = T.page_stats_all;
  $("mZonesLabel").textContent = T.page_map_zones;
  $("mHint").textContent = T.page_map_hint;
  for (const [id, k] of [["mZin", "page_map_zoomin"], ["mZout", "page_map_zoomout"], ["mZreset", "page_map_reset"], ["mFull", "page_map_full"]]) {
    $(id).title = T[k];
    $(id).setAttribute("aria-label", T[k]);
  }
  loadIcons();
  build();
  updateLimits();
  // the timer on: the whole screen, where it shows
  if (values.timerOn === "1") $("v_full").checked = true;
  draw();
});

function build() {
  const groups = {};
  for (const f of data.fields) {
    const k = (f.advanced ? "a:" : "b:") + f.group;
    (groups[k] = groups[k] || []).push(f);
  }
  for (const [k, fields] of Object.entries(groups)) {
    const sec = document.createElement("section");
    const banner = document.createElement("span");
    banner.className = "banner";
    banner.textContent = data.groups[fields[0].group];
    const box = document.createElement("div");
    box.className = "group";
    fields.forEach(f => box.appendChild(control(f)));
    if (k === "b:timer") box.appendChild(timerPanel());
    sec.append(banner, box);
    $(k.startsWith("a:") ? "formAdv" : "form").appendChild(sec);
  }
}

function control(f) {
  const el = document.createElement("div");
  el.className = "field";
  const id = "f_" + f.key;
  const label = document.createElement(f.kind === "choice" ? "span" : "label");
  label.className = "label";
  label.textContent = f.label;
  if (f.kind !== "choice") label.htmlFor = id;
  let input;
  const v = values[f.key] ?? f.default;

  if (f.kind === "bool") {
    el.classList.add("inline");
    input = document.createElement("span");
    input.className = "toggle";
    input.innerHTML = '<input type="checkbox" id="' + id + '"><span></span>';
    const cb = input.querySelector("input");
    cb.checked = v === "1";
    cb.onchange = () => set(f.key, cb.checked ? "1" : "0");
  } else if (f.kind === "choice") {
    input = document.createElement("div");
    const short = f.choices.every(c => c.label.length <= 12);
    input.className = "seg" + (short ? " row" : "");
    input.setAttribute("role", "radiogroup");
    f.choices.forEach((c, i) => {
      const rid = id + "_" + i;
      const r = document.createElement("input");
      r.type = "radio"; r.name = id; r.id = rid; r.value = c.value; r.checked = c.value === v;
      r.onchange = () => set(f.key, c.value);
      const l = document.createElement("label");
      l.htmlFor = rid; l.textContent = c.label;
      input.append(r, l);
    });
  } else if (f.kind === "range") {
    input = document.createElement("div");
    input.className = "range";
    input.innerHTML = '<input type="range" id="' + id + '"><output></output>';
    const r = input.querySelector("input"), o = input.querySelector("output");
    Object.assign(r, { min: f.min, max: f.max, step: f.step, value: v });
    const pct = () => f.max <= 1 ? Math.round(r.value * 100) + " %" : "×" + Number(r.value).toFixed(2);
    o.textContent = pct();
    r.oninput = () => { o.textContent = pct(); set(f.key, r.value); };
  } else if (f.kind === "slider") {
    input = document.createElement("div");
    input.className = "range";
    input.innerHTML = '<input type="range" aria-label="' + f.label + '"><input type="number" id="' + id + '">';
    const [r, n] = input.querySelectorAll("input");
    // a bound of 0 is left out of the data: min 0 by default
    for (const e of [r, n]) Object.assign(e, { min: f.min ?? 0, max: f.max, step: f.step || 1, value: v });
    sliders[f.key] = { r, n };
    const apply = v => {
      // the overlay position has limits that depend on its size; the other sliders their own
      const L = limits()[f.key] || { min: f.min ?? 0, max: f.max ?? Infinity };
      v = Math.min(L.max, Math.max(L.min, Number(v)));
      if (isNaN(v)) return;
      r.value = v; if (Number(n.value) !== v) n.value = v;
      set(f.key, String(v));
    };
    r.oninput = () => apply(r.value);
    n.oninput = () => { if (n.value !== "") apply(n.value); };
    n.onblur = () => { n.value = values[f.key]; };
  } else if (f.kind === "number") {
    el.classList.add("inline");
    input = document.createElement("input");
    Object.assign(input, { type: "number", id, min: f.min, max: f.max, step: f.step || 1, value: v });
    input.oninput = () => { if (input.value !== "") set(f.key, input.value); };
  } else if (f.kind === "date") {
    input = dateControl(f, id, v);
  } else if (f.kind === "key") {
    input = keyControl(f, id, v);
  } else {
    input = document.createElement("input");
    Object.assign(input, { type: "text", id, value: v, spellcheck: false });
    input.oninput = () => set(f.key, input.value);
  }
  el.append(label, input);
  if (f.help) {
    const h = document.createElement("div");
    h.className = "help";
    h.textContent = f.help;
    el.appendChild(h);
  }
  return el;
}

// Key binding: the next key or mouse button pressed. The browser's keyCode is the Windows virtual-key
// code the program watches. Stored as "code:name", "0" for none.
function keyControl(f, id, v) {
  const T = data.text;
  const wrap = document.createElement("div");
  wrap.className = "keybind";
  const cap = document.createElement("span");
  cap.className = "keycap";
  const change = document.createElement("button");
  change.type = "button"; change.className = "btn"; change.id = id; change.textContent = T.page_key_set;
  const clear = document.createElement("button");
  clear.type = "button"; clear.className = "btn"; clear.textContent = T.page_key_clear;
  const show = val => {
    const name = String(val || "").includes(":") ? val.slice(val.indexOf(":") + 1) : (val && val !== "0" ? val : "");
    cap.className = "keycap" + (name ? "" : " none");
    cap.textContent = name || T.page_key_none;
  };
  let stop = null;
  const done = val => {
    if (stop) stop();
    stop = null;
    keyWaiting = null;
    if (val !== undefined) set(f.key, val);
    show(values[f.key] ?? f.default);
  };
  change.onclick = () => {
    if (stop) return;
    // another key control waiting: it stops waiting, so that a key goes to one setting only
    if (keyWaiting) keyWaiting();
    keyWaiting = () => done();
    cap.className = "keycap wait";
    cap.textContent = T.page_key_wait;
    const key = e => {
      e.preventDefault();
      e.stopImmediatePropagation();
      if (e.key === "Escape") return done();
      if (!e.keyCode || e.keyCode === 229) return;
      done(e.keyCode + ":" + keyName(e));
    };
    const mouse = e => {
      if (e.button < 1 || e.button > 4) return; // left and right buttons stay for the page
      e.preventDefault();
      const vk = { 1: 4, 3: 5, 4: 6 }[e.button];
      if (vk) done(vk + ":" + T.page_mouse + " " + { 1: 3, 3: 4, 4: 5 }[e.button]);
    };
    const block = e => e.preventDefault();
    setTimeout(() => {
      window.addEventListener("keydown", key, true);
      window.addEventListener("mousedown", mouse, true);
      window.addEventListener("auxclick", block, true);
    }, 0);
    stop = () => {
      window.removeEventListener("keydown", key, true);
      window.removeEventListener("mousedown", mouse, true);
      setTimeout(() => window.removeEventListener("auxclick", block, true), 300);
    };
  };
  clear.onclick = () => done("0");
  show(v);
  wrap.append(cap, change, clear);
  return wrap;
}

let keyWaiting = null; // stops the key control waiting for a key

function keyName(e) {
  const c = e.code || "";
  if (/^Key[A-Z]$/.test(c) || /^Digit\d$/.test(c)) return e.key.length === 1 ? e.key.toUpperCase() : c.slice(-1);
  if (/^F\d+$/.test(c)) return c;
  if (c.startsWith("Numpad")) return "Num " + (c.slice(6) || e.key);
  if (e.key && e.key.length === 1 && e.key !== " ") return e.key.toUpperCase();
  return c || e.key;
}

function dateControl(f, id, v) {
  const T = data.text;
  const wrap = document.createElement("div");
  wrap.className = "date";
  const [d, t] = (v || "").split(" ");
  wrap.innerHTML =
    '<input type="date" id="' + id + '">' +
    '<span class="time"><input type="time" id="' + id + '_t"> ' + T.page_time + '</span>' +
    '<label class="check"><input type="checkbox" id="' + id + '_all"> ' + T.page_always + '</label>';
  const di = wrap.querySelector("#" + id), ti = wrap.querySelector("#" + id + "_t"), all = wrap.querySelector("#" + id + "_all");
  di.value = d || "";
  ti.value = t || "";
  all.checked = !d;
  const sync = () => {
    wrap.classList.toggle("off", all.checked);
    if (all.checked) set(f.key, "");
    else if (di.value) set(f.key, di.value + (ti.value ? " " + ti.value : ""));
  };
  all.onchange = () => {
    if (!all.checked && !di.value) di.value = new Date().toISOString().slice(0, 10);
    sync();
  };
  di.onchange = ti.onchange = () => { if (di.value) all.checked = false; sync(); };
  wrap.classList.toggle("off", all.checked);
  return wrap;
}

function set(k, v) {
  values[k] = v;
  // the timer is out of the zoomed view of the overlay: the preview shows the whole screen
  if (k.startsWith("timer") && values.timerOn === "1") $("v_full").checked = true;
  refresh();
}

// changes are saved on their own, shortly after the last one
let saveTimer = null;

function refresh() {
  updateLimits();
  if (JSON.stringify(values) !== saved) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(save, 500);
  }
  draw();
}

function save() {
  saveTimer = null;
  const body = JSON.stringify(values);
  if (body === saved) return Promise.resolve();
  return fetch(api + "settings", { method: "POST", headers: { "Content-Type": "application/json" }, body })
    .then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(t)))
    .then(() => {
      saved = body;
      flash($("status"), data.text.page_saved);
    })
    .catch(e => { $("status").className = "status err"; $("status").textContent = String(e).trim(); });
}

// a message that fades after a few seconds
function flash(el, text) {
  el.className = el.className.replace(/ (ok|err)\b/g, "") + " ok";
  el.textContent = text;
  el.hidden = false;
  clearTimeout(el.timer);
  el.timer = setTimeout(() => { el.textContent = ""; }, 4000);
}

$("reset").onclick = () => {
  if (!confirm(data.text.page_reset_ask)) return;
  // the challenge start stays: its default is today, which would leave out every older harvest
  for (const f of data.fields) if (f.key !== "since") values[f.key] = f.default;
  $("form").innerHTML = ""; $("formAdv").innerHTML = "";
  build();
  refresh();
};
$("close").onclick = () => {
  (saveTimer ? save() : Promise.resolve()).finally(() => {
    document.body.classList.add("is-closed");
    window.close();
  });
};
// a tab closed right after a change: send it anyway
window.addEventListener("pagehide", () => {
  if (saveTimer && navigator.sendBeacon) navigator.sendBeacon(api + "settings", new Blob([JSON.stringify(values)], { type: "application/json" }));
});

/* ---- trophies by reserve: found in the harvests, or added by hand ---- */
let trophies = null, tReserve = null;
const fmt = (s, ...a) => s.replace(/%d/g, () => a.shift());

function showTab(name) {
  document.body.dataset.tab = name;
  for (const [id, n] of [["tabSettings", "settings"], ["tabTrophies", "trophies"], ["tabStats", "stats"], ["tabMap", "map"], ["tabAlbum", "album"]]) {
    $(id).classList.toggle("on", n === name);
    $(id).setAttribute("aria-selected", n === name);
  }
  if (name === "trophies") loadTrophies();
  else if (name === "stats") loadStats();
  else if (name === "map") loadMap();
  else if (name === "album") loadAlbum();
  else draw();
}
$("tabSettings").onclick = () => showTab("settings");
$("tabTrophies").onclick = () => showTab("trophies");
$("tabStats").onclick = () => showTab("stats");
$("tabMap").onclick = () => showTab("map");
$("tabAlbum").onclick = () => showTab("album");

// medal counted for the challenge, from a level: -1 Great One (a diamond), 0 diamond .. 4 none
function doneLevel(lv) {
  const target = parseInt(values.tier ?? "1"), higher = values.higher !== "0";
  lv = Math.max(lv, 0);
  return lv < 4 && (lv === target || (higher && lv < target));
}

function pickReserve(n) {
  tReserve = n;
  showTrophies();
  $("tDetail").scrollIntoView({ behavior: "smooth", block: "start" });
}

// overview: progress of each reserve, then the species missing everywhere with where they live
function showOverview(d) {
  const T = data.text, el = tag => document.createElement(tag);
  const card = (name, done, all, n) => {
    const c = el(n === undefined ? "div" : "button");
    c.className = "card" + (n === undefined ? " global" : "") + (n === tReserve ? " on" : "") + (all && done === all ? " done" : "");
    const cn = el("span"); cn.className = "cn"; cn.textContent = name; c.title = name;
    const cv = el("span"); cv.className = "cv"; cv.textContent = done + "/" + all + " · " + Math.round(100 * done / Math.max(all, 1)) + " %";
    const m = el("div"); m.className = "meter";
    const i = el("i"); i.style.width = (100 * done / Math.max(all, 1)) + "%";
    m.appendChild(i);
    c.append(cn, cv, m);
    if (n !== undefined) { c.type = "button"; c.id = "card_" + n; c.onclick = () => pickReserve(n); }
    return c;
  };
  const cards = $("oCards");
  cards.innerHTML = "";
  const global = Object.entries(d.global || {});
  cards.appendChild(card(T.page_all_species, global.filter(([, r]) => doneLevel(level(r))).length, global.length));
  for (const res of d.reserves) {
    const done = res.species.filter(sp => doneLevel(Math.min(level(sp.detected), level(sp.manual)))).length;
    cards.appendChild(card(res.name, done, res.species.length, res.n));
  }
  // missing species: not done in any reserve
  const where = {};
  for (const res of d.reserves) for (const sp of res.species) {
    (where[sp.hash] = where[sp.hash] || { hash: sp.hash, name: sp.name, cls: sp.cls, in: [] }).in.push(res);
  }
  const missing = global.filter(([, r]) => !doneLevel(level(r))).map(([h]) => where[h]).filter(Boolean)
    .sort((a, b) => a.cls - b.cls || a.name.localeCompare(b.name));
  $("oMissTitle").textContent = fmt(T.page_missing, missing.length);
  const list = $("oMissList");
  list.innerHTML = "";
  if (!missing.length) {
    const p = el("div"); p.className = "mrow muted"; p.textContent = T.page_missing_none;
    list.appendChild(p);
  }
  for (const m of missing) {
    const row = el("div"); row.className = "mrow";
    const name = el("span"); name.className = "name"; name.textContent = m.name;
    const cls = el("span"); cls.className = "cls muted"; cls.textContent = m.cls;
    name.append(" ", cls);
    row.append(speciesIcon(m.hash, 4), name);
    for (const res of m.in) {
      const b = el("button"); b.type = "button"; b.className = "chip"; b.textContent = res.name;
      b.onclick = () => pickReserve(res.n);
      row.appendChild(b);
    }
    list.appendChild(row);
  }
}

function trophyError(e) {
  clearTimeout($("tStatus").timer);
  $("tStatus").className = "status err";
  $("tStatus").textContent = String(e).trim();
}

// counted with the start date and mode shown in the settings, even unsaved
function loadTrophies() {
  const q = new URLSearchParams({ since: values.since || "", scope: values.scope || "reserve" });
  fetch(api + "trophies?" + q)
    .then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(t)))
    .then(d => { trophies = d; if ($("tStatus").classList.contains("err")) $("tStatus").textContent = ""; showTrophies(); })
    .catch(e => { trophyError(e); $("tList").innerHTML = ""; });
}

function showTrophies() {
  const T = data.text, d = trophies, sel = $("tRes");
  if (!d.reserves || !d.reserves.length) return;
  if (!sel.options.length) {
    for (const r of d.reserves) sel.add(new Option(r.name, r.n));
    sel.onchange = () => { tReserve = Number(sel.value); showTrophies(); };
  }
  if (tReserve === null) tReserve = d.reserves.some(r => r.n === d.reserve) ? d.reserve : d.reserves[0].n;
  sel.value = String(tReserve);
  $("tCount").textContent = fmt(T.page_recorded, d.recorded, d.manual);
  $("tMode").textContent = values.scope === "mega" ? T.page_mode_mega : T.page_mode_reserve;
  const tiers = tierNames();
  const res = d.reserves.find(r => r.n === tReserve);
  showOverview(d);
  const focus = document.activeElement && document.activeElement.id;
  const list = $("tList");
  list.innerHTML = "";
  for (const sp of res.species) list.appendChild(trophyRow(sp, res.n, tiers));
  if (focus && $(focus)) $(focus).focus();
}

// ranks: 0 diamond .. 3 bronze, 4 none, 5 Great One (above a diamond)
const GREAT_ONE = 5;
const RARE_FUR = 2; // rarity of a rare fur: 2 rare, 3 very rare
const level = r => r === GREAT_ONE ? -1 : r;
const rankName = (r, tiers) => r === GREAT_ONE ? data.text.page_great_one : r < 4 ? tiers[r] : data.text.page_rank_none;
// names of the medals of the settings, as written in the page: "Diamant"
function tierNames() {
  const given = String(values.tiers || "").split(","), def = String(data.fields.find(f => f.key === "tiers").default).split(",");
  return [0, 1, 2, 3].map(i => {
    const s = (given[i] || "").trim() || def[i] || "";
    return s.charAt(0) + s.slice(1).toLowerCase();
  });
}

// choices: none, bronze .. diamond, Great One; those not better than the medal found are disabled
function trophyRow(sp, n, tiers) {
  const T = data.text, el = tag => document.createElement(tag);
  const row = el("div"); row.className = "trow";
  const best = Math.min(level(sp.detected), level(sp.manual));
  const furs = sp.furs || [];
  const hex = speciesIcon(sp.hash, best < 0 ? GREAT_ONE : best, furs.length > 0);
  const name = el("span"); name.className = "name";
  const nm = el("b"); nm.textContent = sp.name; nm.title = T.page_sheet_open;
  nm.onclick = () => openSheet(sp.hash);
  name.appendChild(nm);
  const cls = el("span"); cls.className = "cls"; cls.textContent = sp.cls;
  name.appendChild(cls);
  if (furs.length) {
    const f = el("span"); f.className = "fur"; f.textContent = "★ " + furs.join(", ");
    name.appendChild(f);
  }
  if (sp.t && sp.t[1] > 0) {
    const th = el("span"); th.className = "thr"; th.title = T.page_sheet_medals;
    th.textContent = [2, 1, 0].map(i => tiers[i] + " " + scoreText(sp.t[2 - i])).join(" · ");
    name.appendChild(th);
  }
  const det = el("span"); det.className = "det";
  det.textContent = sp.detected === 4 ? "–" : rankName(sp.detected, tiers);
  if (sp.detected !== 4) det.style.color = medalColor(sp.detected);
  const seg = el("div"); seg.className = "seg row";
  seg.setAttribute("role", "radiogroup");
  seg.setAttribute("aria-label", sp.name + " – " + T.page_by_hand);
  for (const rank of sp.canGo ? [4, 3, 2, 1, 0, GREAT_ONE] : [4, 3, 2, 1, 0]) {
    const id = "t_" + n + "_" + sp.hash + "_" + rank;
    const r = el("input");
    r.type = "radio"; r.name = "t_" + n + "_" + sp.hash; r.id = id;
    r.checked = rank === sp.manual;
    r.disabled = rank !== 4 && level(rank) >= level(sp.detected);
    r.onchange = () => setTrophy(sp, n, rank);
    const l = el("label"); l.htmlFor = id; l.textContent = rankName(rank, tiers);
    seg.append(r, l);
  }
  if (sp.detected !== 4 && sp.here) {
    const text = det.textContent;
    det.textContent = "";
    det.append(mapLink(text, null, () => openOnMap({ r: n, s: sp.hash, all: true })));
  }
  row.append(hex, name, det, seg);
  return row;
}

function setTrophy(sp, n, rank) {
  fetch(api + "trophies", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ species: sp.hash, reserve: n, rank, since: values.since || "" }) })
    .then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(t)))
    .then(() => { flash($("tStatus"), data.text.page_saved); loadTrophies(); })
    .catch(trophyError);
}

/* ---- species icons of the game, coloured as in the overlay ---- */
let icons = {};

function loadIcons() {
  fetch(api + "icons").then(r => r.ok ? r.json() : {}).then(d => {
    icons = d || {};
    if (document.body.dataset.tab === "trophies" && trophies) showTrophies();
    if (document.body.dataset.tab === "stats" && harvests) showStats();
    if (document.body.dataset.tab === "map" && harvests) showMap();
    if (document.body.dataset.tab === "album" && harvests) showAlbum();
  }).catch(() => {});
}

// rank: 0 diamond .. 3 bronze, 4 none, 5 Great One (tinted as a diamond, as in the game)
// rare: a white star over the corner, for a rare fur (the icon keeps the colour of the medal)
function speciesIcon(hash, rank, rare) {
  const lv = rank === GREAT_ONE ? 0 : Math.min(rank, 4);
  const s = document.createElement("span");
  if (!icons[hash]) {
    s.className = "hex";
    if (lv < 4) s.style.background = TINT[lv];
  } else {
    s.className = "icon";
    s.innerHTML = icons[hash];
    s.firstChild.style.filter = "url(#tint" + lv + ")";
  }
  if (!rare) return s;
  const w = document.createElement("span");
  w.className = "rare " + s.className;
  w.append(s);
  w.insertAdjacentHTML("beforeend", '<svg class="star" viewBox="-10 -10 20 20" aria-hidden="true"><path d="M0-9 2.12-2.91 8.56-2.78 3.42 1.11 5.29 7.28 0 3.6-5.29 7.28-3.42 1.11-8.56-2.78-2.12-2.91Z"/></svg>');
  return w;
}

/* ---- statistics of the harvests recorded ---- */
let harvests = null;
const GO_COLOR = "#C9A2FF";
const medalColor = r => r === GREAT_ONE ? GO_COLOR : r < 4 ? MEDAL[r] : "#6b7177";
$("sR_since").onchange = $("sR_all").onchange = () => showStats();

function loadStats() {
  fetch(api + "harvests")
    .then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(t)))
    .then(d => { harvests = d; showStats(); })
    .catch(e => { $("sTiles").textContent = String(e).trim(); $("sBody").hidden = true; });
}

// challenge start of the settings, in Unix seconds; 0 for all time
function sinceTime() {
  const m = /^(\d{4})-(\d\d)-(\d\d)(?: (\d\d):(\d\d))?/.exec(values.since || "");
  return m ? new Date(+m[1], m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)).getTime() / 1000 : 0;
}

// horizontal bars: label, bar, value; the bar colour follows the item (a medal) or is the accent
function hbars(box, rows) {
  const max = Math.max(1, ...rows.map(r => r.n)), total = rows.reduce((a, r) => a + r.n, 0);
  box.innerHTML = "";
  for (const r of rows) {
    const row = document.createElement("div");
    row.className = "hrow";
    row.title = r.label + " : " + r.n + " (" + Math.round(100 * r.n / Math.max(total, 1)) + " %)";
    if (r.go) { row.classList.add("link"); row.onclick = r.go; row.title += " – " + data.text.page_map_see; }
    const l = document.createElement("span"); l.className = "hl";
    if (r.icon) l.appendChild(r.icon);
    else if (r.color) { const sw = document.createElement("span"); sw.className = "sw"; sw.style.background = r.color; l.appendChild(sw); }
    l.append(r.label);
    const t = document.createElement("span"); t.className = "ht";
    const i = document.createElement("i"); i.style.width = (100 * r.n / max) + "%";
    if (r.color) i.style.background = r.color;
    if (!r.n) i.style.minWidth = "0";
    t.appendChild(i);
    const v = document.createElement("span"); v.className = "hv"; v.textContent = r.n;
    row.append(l, t, v);
    box.appendChild(row);
  }
}

function showStats() {
  const T = data.text, d = harvests, since = sinceTime();
  if (!d) return;
  $("sRange").hidden = !since;
  const all = !since || $("sR_all").checked;
  // medal names as written in the settings, usually in capitals: "Diamant" reads better here
  const tiers = tierNames();
  const list = d.harvests.filter(h => all || h.t >= since).sort((a, b) => b.t - a.t);
  const count = f => list.filter(f).length;
  const tiles = [
    [list.length, T.page_harvests],
    [new Set(list.map(h => h.s)).size, T.page_species_n],
    [count(h => h.rank === GREAT_ONE), T.page_great_one],
    [count(h => h.rank === 0), tiers[0]],
    [count(h => h.rank === 1), tiers[1]],
    [count(h => h.rarity >= RARE_FUR), T.page_rare_furs],
  ];
  $("sTiles").innerHTML = "";
  for (const [n, label] of tiles) {
    const t = document.createElement("div"); t.className = "tile";
    const b = document.createElement("b"); b.textContent = n;
    const s = document.createElement("span"); s.textContent = label;
    t.append(b, s);
    $("sTiles").appendChild(t);
  }
  $("sBody").hidden = !list.length;
  if (!list.length) {
    const t = document.createElement("div"); t.className = "tile"; t.style.gridColumn = "1 / -1";
    t.textContent = T.page_no_harvest;
    $("sTiles").appendChild(t);
    return;
  }
  hbars($("sMedals"), [GREAT_ONE, 0, 1, 2, 3, 4].map(r => ({ label: rankName(r, tiers), n: count(h => h.rank === r), color: medalColor(r) })));
  const by = key => {
    const m = new Map();
    for (const h of list) m.set(key(h), (m.get(key(h)) || 0) + 1);
    return [...m.entries()].sort((a, b) => b[1] - a[1]);
  };
  const resName = r => d.reserves[r] || T.page_unknown;
  hbars($("sRes"), by(h => h.r).map(([r, n]) => ({ label: resName(r), n, go: d.reserves[r] ? () => openOnMap({ r: Number(r), all: !since || $("sR_all").checked, period: true }) : null })));
  const bestOf = s => list.filter(h => h.s === s).reduce((b, h) => level(h.rank) < level(b) ? h.rank : b, 4);
  hbars($("sTop"), by(h => h.s).slice(0, 10).map(([s, n]) => ({ label: d.species[s] || "?", n, icon: speciesIcon(s, bestOf(s)), go: () => openSheet(Number(s)) })));
  // last harvests
  harvestTable($("sRecent"), list.slice(0, 20), tiers, resName);
  // rare furs of the period, all of them
  const rare = list.filter(h => h.rarity >= RARE_FUR);
  $("sRareSec").hidden = !rare.length;
  $("sRareT").textContent = T.page_rare_furs + " (" + rare.length + ")";
  harvestTable($("sRare"), rare, tiers, resName, true);
}

// chance of a fur, from the game: one value, or the range when males and females differ
function oddsText(odds) {
  const nf = new Intl.NumberFormat(data.lang, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const v = (odds || []).filter(x => x > 0);
  if (!v.length) return "";
  const lo = nf.format(Math.min(...v)), hi = nf.format(Math.max(...v));
  return (lo === hi ? lo : lo + "–" + hi) + " %";
}

// table of harvests: date, species, fur (with its chance when odds is set), score, medal, reserve
function harvestTable(tb, rows, tiers, resName, odds) {
  const T = data.text, d = harvests;
  tb.innerHTML = "";
  const head = tb.insertRow();
  for (const [text, num] of [[T.page_col_date], [T.page_col_species], [T.page_col_fur], [T.page_col_score, true], [T.page_col_medal], [T.page_reserve]]) {
    const th = document.createElement("th"); th.textContent = text;
    if (num) th.className = "num";
    head.appendChild(th);
  }
  const date = new Intl.DateTimeFormat(data.lang, { dateStyle: "short", timeStyle: "short" });
  for (const h of rows) {
    const tr = tb.insertRow();
    const rare = h.rarity >= RARE_FUR;
    const cells = [date.format(new Date(h.t * 1000)), d.species[h.s] || "?", (rare ? "★ " : "") + (h.fur || "–"), h.score.toFixed(2), rankName(h.rank, tiers), resName(h.r)];
    cells.forEach((c, i) => {
      const td = tr.insertCell(); td.textContent = c;
      if (i === 1) {
        td.prepend(speciesIcon(h.s, h.rank, rare));
        td.classList.add("sp-open");
        td.title = data.text.page_sheet_open;
        td.onclick = () => openSheet(h.s);
      }
      if (i === 2 && rare) td.className = "fur-rare";
      if (i === 2 && h.fur && odds) {
        const o = document.createElement("span"); o.className = "odds"; o.textContent = oddsText(h.odds);
        td.append(o);
      }
      if (i === 3) td.className = "num";

const scoreNf = () => new Intl.NumberFormat(data.lang, { maximumFractionDigits: 2 });

// the harvests, loaded once for the tabs that need them

// start of the furs counted: the challenge start, or all time
const albumSince = () => $("aR_all").checked ? 0 : sinceTime();

// state of each rare fur since a time: harvested (the first time), ticked by hand, or missing; a fur
// harvested before is told apart
function furState(species, fur, since = 0) {
  const d = harvests, mine = d.harvests.filter(h => h.s === species && h.fur === fur.n).sort((a, b) => a.t - b.t);
  const first = mine.find(h => h.t >= since);
  if (first) return { got: first };
  return { hand: d.album.some(([s, f, t]) => s === species && f === fur.h && (t || 0) >= since), before: mine[0] };
}

// a rare fur of the album: ticked by hand on a click, unless harvested
function furButton(species, fur, redraw, since = 0) {
  const T = data.text, st = furState(species, fur, since), b = document.createElement("button");
  b.type = "button";
  b.className = "afur" + (st.got ? " got" : st.hand ? " hand" : "");
  const date = new Intl.DateTimeFormat(data.lang, { dateStyle: "medium" });
  b.title = st.got ? fmt(T.page_album_got, date.format(new Date(st.got.t * 1000))) : st.hand ? T.page_album_hand
    : (st.before ? fmt(T.page_album_before, date.format(new Date(st.before.t * 1000))) + " " : "") + T.page_album_tick;
  b.setAttribute("aria-pressed", String(!!(st.got || st.hand)));
  const mark = document.createElement("span"); mark.className = "st"; mark.textContent = st.got || st.hand ? "★" : "☆";
  const name = document.createElement("span"); name.textContent = fur.n + " · " + (fur.r >= 3 ? T.page_album_vrare : T.page_album_rare);
  const odds = document.createElement("small"); odds.textContent = oddsText(fur.o);
  b.append(mark, name, odds);
  if (!st.got) b.onclick = () => {

      .then(r => r.ok ? r.json() : r.text().then(t => Promise.reject(t)))
      .then(() => {
        const a = harvests.album.filter(([s, f]) => !(s === species && f === fur.h));
        if (!st.hand) a.push([species, fur.h, Math.floor(Date.now() / 1000)]);
        harvests.album = a;
        redraw();
      })
      .catch(e => alert(String(e).trim()));
  };
  return b;
}

function showAlbum() {
  const T = data.text, d = harvests;
  if (!d) return;
  const q = $("aSearch").value.trim().toLowerCase(), have = $("aS_have").checked, miss = $("aS_miss").checked;
  const grid = $("aGrid");
  grid.innerHTML = "";

    .sort((a, b) => a[2].localeCompare(b[2]));
  for (const [s, info, name] of species) {
    const since = albumSince(), states = info.furs.map(f => furState(s, f, since)), n = states.filter(st => st.got || st.hand).length;
    got += n; all += info.furs.length;

// the species done of the challenge, each at the first harvest that did it, and the total
function challengeUnits() {
  const d = harvests, t = recapData.trophies, mega = values.scope === "mega", since = sinceTime();
  const need = new Set(), byHand = new Set();
  for (const res of t.reserves) for (const sp of res.species) {
    const k = mega ? String(sp.hash) : res.n + "/" + sp.hash;
    need.add(k);
    if (doneLevel(level(sp.manual))) byHand.add(k);
  }
  const first = new Map();
  for (const h of d.harvests) {
    if (h.t < since || !doneLevel(level(h.rank))) continue;
    const k = mega ? String(h.s) : h.r + "/" + h.s;
    if (need.has(k) && (!first.has(k) || h.t < first.get(k))) first.set(k, h.t);
  }
  for (const k of byHand) if (!first.has(k)) first.set(k, since);
  return { events: [...first.values()].sort((a, b) => a - b), total: need.size };
}

// time of the challenge timer at a Unix time; null without a timer
function timerAt(tm, t) {
  if (!tm || !tm.elapsed) return null;
  const counted = tm.sessions.reduce((n, [a, b]) => n + (b - a), 0);
  let v = tm.elapsed - counted;
  for (const [a, b] of tm.sessions) if (a < t) v += Math.min(b, t) - a;
  return Math.max(v, 0);
}

// sessions of play: those of the timer, else harvests less than 1 h 30 apart. The timer starts a new
// stretch each time the game leaves the front (alt-tab, pause): stretches less than 1 h 30 apart
// make one session.
function playSessions(tm, times) {
  const out = [];
  if (tm && tm.sessions.length) {
    for (const [a, b] of tm.sessions) {
      const l = out[out.length - 1];
      if (l && a - l[1] <= 5400) l[1] = Math.max(l[1], b); else out.push([a, b]);
    }
    return out;
  }
  for (const t of [...times].sort((a, b) => a - b)) {
    const l = out[out.length - 1];
    if (l && t - l[1] <= 5400) l[1] = t; else out.push([t, t]);
  }
  return out.map(([a, b]) => [a - 1200, b + 600]);
}

function drawRecap() {
  const T = data.text, d = harvests, tm = recapData.timer, cv = $("recapCv"), g = cv.getContext("2d");
  const W = 1600, H = 900, session = $("rP_sess").checked, tiers = tierNames();
  const since = sinceTime(), mega = values.scope === "mega";
  const all = d.harvests.filter(h => h.t >= since);
  const units = challengeUnits();
  // the timer tells the sessions and the time when it covers the challenge (set by its estimate),
  // else the sessions come from the harvests and the progress goes by dates
  const firstT = all.length ? Math.min(...all.map(h => h.t)) : Infinity;
  const timed = !!(tm && tm.elapsed && tm.sessions.length && tm.sessions[0][0] <= firstT + 3600);
  const sessions = playSessions(timed ? tm : null, all.map(h => h.t)).filter(([a, b]) => b - a > 60);
  let from = since, to = Math.floor(Date.now() / 1000);
  if (session && sessions.length) [from, to] = sessions[sessions.length - 1];
  const list = all.filter(h => h.t >= from && h.t <= to);
  const events = units.events.filter(t => t >= from && t <= to);
  const C = { bg: "#141618", panel: "#1c1f22", panel2: "#23272b", line: "#2f3439", text: "#e9e6df", muted: "#9ba1a6", accent: "#ec9a1e" };
  const cond = (w, s) => w + " " + s + 'px "Barlow Condensed", sans-serif', body = (w, s) => w + " " + s + 'px "Barlow", sans-serif';
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  g.textBaseline = "alphabetic";
  // title
  g.font = cond(600, 46); g.fillStyle = C.accent; g.fillText("COTW", 60, 86);
  const lw = g.measureText("COTW").width;
  g.fillStyle = C.text; g.fillText("GOLDCHALLENGE", 60 + lw, 86);
  g.textAlign = "right";
  g.font = cond(600, 34); g.fillStyle = C.text; g.fillText(session ? T.page_recap_ts : T.page_recap_t, W - 60, 70);
  const date = new Intl.DateTimeFormat(data.lang, { dateStyle: "medium" }), dt = new Intl.DateTimeFormat(data.lang, { dateStyle: "medium", timeStyle: "short" });
  const target = tiers[parseInt(values.tier ?? "1")] || "";
  const period = session ? dt.format(new Date(from * 1000)) + " – " + new Intl.DateTimeFormat(data.lang, { timeStyle: "short" }).format(new Date(to * 1000))
    : (since ? date.format(new Date(since * 1000)) : "") + " – " + date.format(new Date(to * 1000));
  g.font = body(400, 20); g.fillStyle = C.muted;
  g.fillText(period + "  ·  " + target + "  ·  " + (mega ? T.page_recap_mega : T.page_recap_res), W - 60, 100);
  g.textAlign = "left";
  g.fillStyle = C.accent; g.fillRect(60, 118, W - 120, 3);
  // tiles
  const tAt = t => timerAt(tm, t);
  let time = null;
  if (session) time = timed ? tAt(to) - tAt(from) : to - from;
  else time = tAt(to);
  const doneAll = units.events.filter(t => t <= to).length;
  const tiles = [
    [time === null ? "—" : clock(time), session ? T.page_recap_stime : time === null ? T.page_recap_notime : T.page_recap_time],
    [(session ? "+" + events.length : doneAll + " / " + units.total), T.page_recap_done],
    [String(list.length), T.page_harvests],
    [time !== null && events.length ? clock(time / events.length) : "—", T.page_recap_avg],
    [list.filter(h => h.rank === 0 || h.rank === GREAT_ONE).length + "  ◆   " + list.filter(h => h.rarity >= RARE_FUR).length + "  ★", tiers[0] + " · " + T.page_rare_furs],
  ];
  const tw = (W - 120 - 4 * 20) / 5;
  tiles.forEach(([v, l], i) => {
    const x = 60 + i * (tw + 20), y = 146;
    g.fillStyle = C.panel; g.fillRect(x, y, tw, 112);
    g.strokeStyle = C.line; g.lineWidth = 1; g.strokeRect(x + .5, y + .5, tw - 1, 111);
    g.fillStyle = i === 1 ? C.accent : C.text; g.font = cond(600, 50); g.fillText(v, x + 18, y + 64);
    g.fillStyle = C.muted; g.font = body(400, 18); g.fillText(l, x + 18, y + 94);
  });
  // a panel with its orange banner
  const panel = (x, y, w, h, title) => {
    g.fillStyle = C.accent; g.fillRect(x, y, w, 36);
    g.fillStyle = "#1a1307"; g.font = cond(600, 21); g.fillText(title.toUpperCase(), x + 14, y + 25);
    g.fillStyle = C.panel; g.fillRect(x, y + 36, w, h - 36);
    g.strokeStyle = C.line; g.strokeRect(x + .5, y + 36.5, w - 1, h - 37);
  };
  // progress: species done over the time of the challenge (or the dates without a timer)
  const px = 60, py = 290, pw = 920, ph = 560;
  panel(px, py, pw, ph, T.page_recap_prog);
  const ax = px + 70, ay = py + 70, aw = pw - 100, ah = ph - 130;
  const useTimer = timed;
  const xOf = t => useTimer ? tAt(t) : t, x0 = xOf(from), x1 = Math.max(xOf(to), x0 + 1);
  const base = session ? units.events.filter(t => t < from).length : 0;
  const ymax = Math.max(1, session ? base + events.length : units.total);
  const X = v => ax + aw * (v - x0) / (x1 - x0), Y = n => ay + ah - ah * (n - (session ? base : 0)) / Math.max(1, ymax - (session ? base : 0));
  g.strokeStyle = C.line; g.lineWidth = 1; g.fillStyle = C.muted; g.font = body(400, 15);
  for (let i = 0; i <= 4; i++) {
    const n = Math.round((session ? base : 0) + (ymax - (session ? base : 0)) * i / 4), y = Y(n);
    g.beginPath(); g.moveTo(ax, y); g.lineTo(ax + aw, y); g.stroke();

  }
  for (let i = 0; i <= 4; i++) {
    const v = x0 + (x1 - x0) * i / 4, x = ax + aw * i / 4;
    g.textAlign = i === 0 ? "left" : i === 4 ? "right" : "center";
    g.fillText(useTimer ? clock(v - (session ? x0 : 0)) : date.format(new Date(v * 1000)), x, ay + ah + 26);
  }
  g.textAlign = "left";
  const pts = [[X(x0), Y(base)]];
  events.forEach((t, i) => { const x = X(xOf(t)); pts.push([x, Y(base + i)], [x, Y(base + i + 1)]); });
  pts.push([X(x1), Y(base + events.length)]);
  const grad = g.createLinearGradient(0, ay, 0, ay + ah);
  grad.addColorStop(0, "rgba(236,154,30,.45)"); grad.addColorStop(1, "rgba(236,154,30,.02)");
  g.beginPath(); g.moveTo(pts[0][0], ay + ah);
  for (const [x, y] of pts) g.lineTo(x, y);
  g.lineTo(pts[pts.length - 1][0], ay + ah); g.closePath(); g.fillStyle = grad; g.fill();
  g.beginPath(); pts.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y));
  g.strokeStyle = C.accent; g.lineWidth = 3; g.stroke();
  if (!list.length) { g.fillStyle = C.muted; g.font = body(400, 20); g.fillText(T.page_recap_none, ax + 20, ay + 40); }
  // medals
  const mx = 1020, my = 290, mw = 520, mh = 270;
  panel(mx, my, mw, mh, T.page_medals);
  const ranks = [GREAT_ONE, 0, 1, 2, 3, 4].map(r => [r, list.filter(h => h.rank === r).length]).filter(([r, n]) => n || r !== GREAT_ONE);
  const mmax = Math.max(1, ...ranks.map(([, n]) => n)), rowH = (mh - 60) / ranks.length;
  ranks.forEach(([r, n], i) => {
    const y = my + 50 + i * rowH;
    g.fillStyle = C.text; g.font = body(400, 17); g.fillText(rankName(r, tiers), mx + 16, y + rowH / 2 + 6);
    const bw = (mw - 210) * n / mmax;
    g.fillStyle = medalColor(r); g.fillRect(mx + 140, y + rowH / 2 - 8, Math.max(bw, n ? 3 : 0), 16);
    g.fillStyle = C.muted; g.textAlign = "right"; g.fillText(String(n), mx + mw - 16, y + rowH / 2 + 6); g.textAlign = "left";
  });
  // harvests per session, or the species of the session
  const bx = 1020, by = 580, bw = 520, bh = 270;
  let bars;
  if (session) {
    const m = new Map();
    for (const h of list) m.set(h.s, (m.get(h.s) || 0) + 1);
    bars = [...m].sort((a, b) => b[1] - a[1]).slice(0, 7).map(([s, n]) => [d.species[s] || "?", n]);
    panel(bx, by, bw, bh, T.page_recap_top);
  } else {
    const ss = sessions.filter(([a, b]) => b >= since).slice(-8);
    bars = ss.map(([a, b]) => [new Intl.DateTimeFormat(data.lang, { day: "numeric", month: "short" }).format(new Date(a * 1000)), all.filter(h => h.t >= a && h.t <= b).length]);
    panel(bx, by, bw, bh, T.page_recap_bys);
  }
  if (bars.length) {
    if (session) {
      const bmax = Math.max(1, ...bars.map(([, n]) => n)), rh = (bh - 60) / bars.length;
      bars.forEach(([l, n], i) => {

function inPolygon(p, x, y) {
  let in_ = false;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {
    if ((p[i][1] > y) !== (p[j][1] > y) && x < (p[j][0] - p[i][0]) * (y - p[i][1]) / (p[j][1] - p[i][1]) + p[i][0]) in_ = !in_;

}

function toEdge(p, x, y) {
  let d = Infinity;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) {

    d = Math.min(d, Math.hypot(x - ax - t * dx, y - ay - t * dy));

  return d;
}

function area(p) {
  let a = 0;
  for (let i = 0, j = p.length - 1; i < p.length; j = i++) a += (p[j][0] + p[i][0]) * (p[j][1] - p[i][1]);
  return Math.abs(a / 2);
}

// precise one the hunter was in, so a harvest of the zone was made out of them
function subZones(z, all) {

// middle of a zone: the point inside its outline farthest from its edges (a zone can be bent),
// searched on a grid of its bounds; out of the zones given (holes) and on land, if it can
function zoneMiddle(z, over, land) {
  const p = z.p, xs = p.map(q => q[0]), ys = p.map(q => q[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const search = (others, ok) => {
    let best = null, far = -1;
    for (let i = 0; i <= 40; i++) for (let j = 0; j <= 40; j++) {
      const x = x0 + (x1 - x0) * i / 40, y = y0 + (y1 - y0) * j / 40;
      if (!inPolygon(p, x, y) || others.some(o => inPolygon(o.p, x, y)) || !ok(x, y)) continue;
      const d = Math.min(toEdge(p, x, y), ...others.map(o => toEdge(o.p, x, y)));

// the zoom tiles seen, at the level that the zoom needs: level L has 2^(L+1) x 2^(L+1) tiles of 512 px
function loadTiles() {
