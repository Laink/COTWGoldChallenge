name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go vet ./...
      - run: ./build.sh ${{ github.ref_name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/COTWSpottingPlus.exe
